server:
  port: 8090
  servlet:
    context-path: /
  compression:
    enabled: true

spring:
  application:
    name: skala-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skala}
    username: ${DB_USER:skala}
    password: ${DB_PASSWORD:skala}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s

skala:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    expiration-ms: 86400000       # 24 часа
    refresh-expiration-ms: 604800000  # 7 дней
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    session-timeout-minutes: 60
  ras:
    connection-timeout-ms: 5000
    read-timeout-ms: 30000
    poll-interval-seconds: 30

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ru.skala: INFO
    org.springframework.security: WARN
  file:
    name: ${LOG_DIR:/var/log/skala}/skala.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
